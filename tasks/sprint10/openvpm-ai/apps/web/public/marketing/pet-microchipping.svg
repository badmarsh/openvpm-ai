<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)" />

  <!-- Subtle circles/waves decoration -->
  <circle cx="400" cy="340" r="280" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.25" />
  <circle cx="400" cy="340" r="210" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.35" />
  <circle cx="400" cy="340" r="140" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="3 5" opacity="0.5" />

  <!-- Central Card -->
  <g filter="url(#shadow)">
    <rect x="140" y="140" width="520" height="520" rx="32" fill="url(#cardGrad)" stroke="#5eead4" stroke-width="1.5" />
  </g>

  <!-- Top Badge -->
  <rect x="250" y="180" width="300" height="38" rx="19" fill="#14b8a6" fill-opacity="0.25" stroke="#2dd4bf" stroke-width="1" />
  <text x="400" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#99f6e4" text-anchor="middle" letter-spacing="1.5">ZÁKONNÁ POVINNOSŤ SR</text>

  <!-- Microchip / Scanner Graphic -->
  <g transform="translate(400, 350)">
    <!-- RFID Chip Icon -->
    <rect x="-60" y="-60" width="120" height="120" rx="24" fill="#042f2e" stroke="#2dd4bf" stroke-width="3" />
    <circle cx="0" cy="0" r="32" fill="#0d9488" />
    
    <!-- Chip details -->
    <path d="M-22 -8 L-38 -8 M-22 8 L-38 8 M22 -8 L38 -8 M22 8 L38 8" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-8 -22 L-8 -38 M8 -22 L8 -38 M-8 22 L-8 38 M8 22 L8 38" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Signal waves -->
    <path d="M -70 -20 A 75 75 0 0 1 -70 20" fill="none" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 70 -20 A 75 75 0 0 0 70 20" fill="none" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -90 -35 A 105 105 0 0 1 -90 35" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 90 -35 A 105 105 0 0 0 90 35" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Paw icon in center -->
    <path d="M-6 8 C-6 4 -3 1 0 1 C3 1 6 4 6 8 C6 13 -6 13 -6 8 Z" fill="#ffffff" />
    <circle cx="-9" cy="-2" r="3.5" fill="#ffffff" />
    <circle cx="-3" cy="-7" r="3.5" fill="#ffffff" />
    <circle cx="3" cy="-7" r="3.5" fill="#ffffff" />
    <circle cx="9" cy="-2" r="3.5" fill="#ffffff" />
  </g>

  <!-- Title & Text -->
  <text x="400" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">Povinné čipovanie zvierat</text>
  <text x="400" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#ccfbf1" text-anchor="middle">Centrálny register spoločenských zvierat (CRSZ)</text>

  <!-- Key info pills -->
  <g transform="translate(400, 570)">
    <rect x="-190" y="-18" width="180" height="36" rx="18" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
    <text x="-100" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e6fffa" text-anchor="middle">✓ Bezpečná aplikácia</text>

    <rect x="10" y="-18" width="180" height="36" rx="18" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
    <text x="100" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e6fffa" text-anchor="middle">✓ Celoživotná ochrana</text>
  </g>

  <!-- Footer Branding -->
  <text x="400" y="730" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#5eead4" text-anchor="middle" letter-spacing="1">VETERINÁRNA STAROSTLIVOSŤ A PREVENCIA</text>
</svg>
