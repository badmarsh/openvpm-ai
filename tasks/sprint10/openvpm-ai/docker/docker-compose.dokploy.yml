version: '3.8'

services:
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - default

  minio-bootstrap:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do
        sleep 1;
      done;
      mc mb --ignore-existing local/$${S3_BUCKET:-openpims};
      mc anonymous set download local/$${S3_BUCKET:-openpims} || true;
      exit 0;
      "
    networks:
      - default

  db-init:
    build:
      context: https://github.com/badmarsh/openvpm-ai.git#main
      dockerfile: apps/web/Dockerfile
      target: builder
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://openpims:${POSTGRES_PASSWORD}@openvpm-postgres-cfoqxx:5432/openpims"
      OPENPIMS_APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      sh -c "
        echo '==> [1/3] Drizzle database bootstrap & trigger layer...' &&
        pnpm --filter @openpims/db db:bootstrap &&
        echo '==> [2/3] Applying PostgreSQL RLS policies & app roles...' &&
        pnpm --filter @openpims/db db:rls &&
        echo '==> [3/3] Seeding Slovak clinical demo data...' &&
        pnpm --filter @openpims/db db:seed:sk &&
        echo '==> Database init completed successfully.'
      "
    networks:
      - default
      - dokploy-network

  web:
    build:
      context: https://github.com/badmarsh/openvpm-ai.git#main
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgresql://openpims:${POSTGRES_PASSWORD}@openvpm-postgres-cfoqxx:5432/openpims"
      OPENPIMS_APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: "https://vet.dev.significa.sk"
      NEXT_PUBLIC_APP_URL: "https://vet.dev.significa.sk"
      EMAIL_PREFERENCE_IDENTITY_SECRET: ${EMAIL_PREFERENCE_IDENTITY_SECRET:-${NEXTAUTH_SECRET}}
      EMAIL_PREFERENCE_SIGNING_SECRET: ${EMAIL_PREFERENCE_SIGNING_SECRET:-${NEXTAUTH_SECRET}}
      FILE_STORAGE_PROVIDER: s3
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
     S3_REGION: "us-east-1"
      NEXT_TELEMETRY_DISABLED: "1"
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-martin.sykora@vetsykora.sk,admin@vetsykora.sk}
      AT_PROXY_URL: ${AT_PROXY_URL}
      AT_PROXY_KEY: ${AT_PROXY_KEY}
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  minio_data:
