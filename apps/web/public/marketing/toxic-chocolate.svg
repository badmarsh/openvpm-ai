<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="50%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="glassTox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="shadowTox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgTox)" />

  <!-- Background warning rings -->
  <circle cx="400" cy="340" r="260" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.25" />
  <circle cx="400" cy="340" r="190" fill="none" stroke="#fca5a5" stroke-width="1" opacity="0.2" />

  <!-- Main Container -->
  <g filter="url(#shadowTox)">
    <rect x="140" y="140" width="520" height="520" rx="32" fill="url(#glassTox)" stroke="#fca5a5" stroke-width="1.5" />
  </g>

  <!-- Tag -->
  <rect x="250" y="180" width="300" height="38" rx="19" fill="#dc2626" fill-opacity="0.4" stroke="#f87171" stroke-width="1" />
  <text x="400" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fecaca" text-anchor="middle" letter-spacing="1.5">VETERINÁRNE VAROVANIE</text>

  <!-- Warning & Chocolate Icon -->
  <g transform="translate(400, 340)">
    <!-- Chocolate Bar outline with prohibition sign -->
    <rect x="-60" y="-55" width="120" height="110" rx="12" fill="#2d1515" stroke="#f87171" stroke-width="2.5" />
    
    <!-- Chocolate grid pieces -->
    <rect x="-50" y="-45" width="45" height="42" rx="4" fill="#3f1d1d" />
    <rect x="5" y="-45" width="45" height="42" rx="4" fill="#3f1d1d" />
    <rect x="-50" y="5" width="45" height="42" rx="4" fill="#3f1d1d" />
    <rect x="5" y="5" width="45" height="42" rx="4" fill="#3f1d1d" />

    <!-- Big Warning / Prohibited Slash -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#ef4444" stroke-width="8" />
    <line x1="-48" y1="-48" x2="48" y2="48" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />

    <!-- Warning Exclamation Badge -->
    <g transform="translate(68, -48)">
      <circle cx="0" cy="0" r="22" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">!</text>
    </g>
  </g>

  <!-- Title & Text -->
  <text x="400" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">Čokoláda je pre psa jed</text>
  <text x="400" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#fee2e2" text-anchor="middle">Teobromín spôsobuje vážnu intoxikáciu</text>

  <!-- Key info pills -->
  <g transform="translate(400, 570)">
    <rect x="-190" y="-18" width="180" height="36" rx="18" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="-100" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#fef2f2" text-anchor="middle">⚠ Okamžite volajte lekára</text>

    <rect x="10" y="-18" width="180" height="36" rx="18" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="100" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#fef2f2" text-anchor="middle">⚠ Pohotovostná linka</text>
  </g>

  <text x="400" y="730" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#fca5a5" text-anchor="middle" letter-spacing="1">PRVÁ POMOC A TOXIKOLÓGIA ZVIERAT</text>
</svg>
